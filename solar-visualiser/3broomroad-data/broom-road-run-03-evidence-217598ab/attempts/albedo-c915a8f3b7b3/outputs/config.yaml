base_config:
- /root/marigold-v2/evaluation/config/inference_depth.yaml
register_modules:
- marigoldv2.dataset.generic_dataset
- marigoldv2.dataset.dataloading.transform
- marigoldv2.dataset.manifest.manifest
- marigoldv2.dataset.manifest.manifest_transforms
- marigoldv2.validation.validate_steps
- marigoldv2.loss.loss
- marigoldv2.experiments.20260316_qwen_depth.network_graph
- marigoldv2.experiments.20260316_qwen_depth.component_loader
- marigoldv2.validation.folder_steps
trainer:
  dtype: torch.bfloat16
  name: GenericTrainer
network_components:
- LoadQwenImageEditVAE:
    name: VAE
- LoadQwenImageEditTransformerFlexible:
    name: Diffuser
network_graph:
  QwenImageEncode:
    kwargs:
      input_key: rgb_norm
      output_key: lat_encoding
  QwenImageEdit2509Step:
    kwargs:
      prefix: qwen_edit_2509_qwen_albedo_rgb_dummy512
      predict_eps: false
      predict_vel: true
      num_inference_steps: 1
      guidance_scale: 1.0
  QwenImageDecode:
    kwargs:
      output_key: pixel_pred
  SelectChannel:
    kwargs:
      input_key: pixel_pred
      output_key: depth_rel_pred_m11
      channel: mean
  FolderRGBAlbedoPrediction:
    kwargs:
      input_key: out/pixel_pred
      output_key: out/albedo_pred
      output_color_space: srgb
dataloader:
  num_workers: 0
  effective_batch_size: 1
  max_train_batch_size: 1
  seed: 2025
validation:
  file_path_key: rgb_path
  main_val_metric: ''
  main_val_metric_goal: minimize
eval:
  eval_metrics: []
optimization:
  lora:
    rank: 128
    lora_alpha: 128
    lora_dropout: 0.0
    init_lora_weights: gaussian
    target_modules:
    - img_in
    - txt_in
    - to_q
    - to_k
    - to_v
    - to_out.0
    - attn.add_k_proj
    - attn.add_v_proj
    - attn.add_q_proj
    - attn.to_add_out
    - norm.linear
    - a_to_out
    - b_to_out
    - img_mlp.net.0.proj
    - img_mlp.net.2
    - txt_mlp.net.0.proj
    - txt_mlp.net.2
    - ff_a.0
    - ff_a.2
    - ff_b.0
    - ff_b.2
    - norm_out.linear
    - proj_out
  scheduler:
    base_lr: 0.0001
  max_iter: 30000
  max_epoch: 100000
  vis_period: 1000
  vis_points: []
  val_period: 1000
  val_points: []
  ckpt_points: []
random_seed: 2025
dataset:
  vis:
    images:
      name: GenericDataset
      disp_name: images
      manifest_cfg:
        name: GenericManifest
        manifest_graph:
        - LoadVKittiManifest:
            base_dir: /content/marigold-results/broom-road-run-03/attempts/albedo-c915a8f3b7b3/inputs
            split: .
            skip_missing_files: false
      transform:
      - ReadRGBImage:
          key: rgb_path
          name: rgb
          use_rel_dir: false
          set_as_orig_res: true
          save_orig: true
      - ReshapeToMultiple:
          multiple: 16
          use_lanczos: true
      validation_steps:
      - RunInference: {}
      - SaveFolderPredictionNpy:
          batch_key: out/albedo_pred
          base_dir: /content/marigold-results/broom-road-run-03/attempts/albedo-c915a8f3b7b3/inputs
          resize_to_orig_res: true
          folder_name: predictions_npy
      - VisualizeFolderAlbedo:
          batch_key: out/albedo_pred
          base_dir: /content/marigold-results/broom-road-run-03/attempts/albedo-c915a8f3b7b3/inputs
          resize_to_orig_res: true
          folder_name: visualizations/albedo
          inverse_spectral: false
paths:
  out_dir: /content/marigold-results/broom-road-run-03/attempts/albedo-c915a8f3b7b3/outputs
  override_vis_dir: /content/marigold-results/broom-road-run-03/attempts/albedo-c915a8f3b7b3/outputs
  ckpt_qwen_image_edit: /root/marigold-v2/assets/checkpoints/Qwen-Image-Edit-2509
  embed_dir: /root/marigold-v2/assets/checkpoints/Marigold-V2/qwen_text_embeddings
in_args:
  config: /content/marigold-results/broom-road-run-03/attempts/albedo-c915a8f3b7b3/outputs/config.yaml
  output_dir: /content/marigold-results/broom-road-run-03/attempts/albedo-c915a8f3b7b3/outputs
  checkpoint: /root/marigold-v2/assets/checkpoints/Marigold-V2/albedo
base_data_dir: null
